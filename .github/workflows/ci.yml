name: CI

on:
  push:
    branches: [main, release/0.0.19]
  pull_request:
    branches: [main, release/0.0.19]

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python-version: '3.8'
            octodns-version: '0.9.17'
          - python-version: '3.8'
            octodns-version: '1.10.0'
          - python-version: '3.10'
            octodns-version: '1.3.0'
          - python-version: '3.10'
            octodns-version: '1.22.0'
          - python-version: '3.12'
            octodns-version: '1.22.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' 'octodns==${{ matrix.octodns-version }}'

      - name: Run tests
        run: pytest tests/ --disable-network -v

  test-python36:
    runs-on: ubuntu-22.04
    container:
      image: python:3.6.15-bullseye@sha256:d097a4907a8ec079df5ac31872359c2de510f82214c0448e926393b376d3b60d
    strategy:
      matrix:
        octodns-version: ['0.9.17', '0.9.21']
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.6 compatible dependencies
        run: |
          python -m pip install 'pip==21.3.1' 'setuptools==59.6.0' 'wheel==0.37.1'
          python -m pip install -e '.[test]' 'octodns==${{ matrix.octodns-version }}'
          python -m pip check
      - name: Run tests on Python 3.6
        run: python -m pytest tests/ --disable-network -v
