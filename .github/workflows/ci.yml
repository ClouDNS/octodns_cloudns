name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.8'
            octodns-version: '0.9.17'
          - python-version: '3.8'
            octodns-version: '1.10.0'
          - python-version: '3.10'
            octodns-version: '1.3.0'
          - python-version: '3.10'
            octodns-version: '1.22.0'
          - python-version: '3.12'
            octodns-version: '1.22.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]' 'octodns==${{ matrix.octodns-version }}'

      - name: Run tests
        run: pytest tests/ --disable-network -v
