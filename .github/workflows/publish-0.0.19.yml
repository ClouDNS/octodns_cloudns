name: Publish approved 0.0.19

on:
  push:
    branches: [release/0.0.19]
    paths: [.github/workflows/publish-0.0.19.yml]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.8'
            octodns: '0.9.17'
          - python: '3.8'
            octodns: '1.10.0'
          - python: '3.10'
            octodns: '1.3.0'
          - python: '3.10'
            octodns: '1.22.0'
          - python: '3.12'
            octodns: '1.22.0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies and test without live credentials
        run: |
          python -m pip install -e '.[test]' 'octodns==${{ matrix.octodns }}'
          python -m pytest tests/ --disable-network -q

  publish:
    needs: compatibility
    if: github.repository == 'ClouDNS/octodns_cloudns' && github.ref == 'refs/heads/release/0.0.19'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and publishing tools
        run: python -m pip install 'build>=1,<2' 'twine>=6,<8'
      - name: Build or resume approved release artifacts
        run: |
          python scripts/publish_0019.py prepare "$RUNNER_TEMP/release-0.0.19"
          python -m twine check "$RUNNER_TEMP/release-0.0.19"/*.whl "$RUNNER_TEMP/release-0.0.19"/*.tar.gz
      - name: Publish exact-source GitHub tag, release and checked assets
        run: python scripts/publish_0019.py github "$RUNNER_TEMP/release-0.0.19"
      - name: Publish missing PyPI files without masking hash conflicts
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_NON_INTERACTIVE: '1'
        run: python scripts/publish_0019.py upload "$RUNNER_TEMP/release-0.0.19"
      - name: Verify PyPI hashes
        run: python scripts/publish_0019.py verify "$RUNNER_TEMP/release-0.0.19"
      - name: Verify installation from PyPI in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/installed-0.0.19"
          "$RUNNER_TEMP/installed-0.0.19/bin/python" -m pip install --no-cache-dir --index-url https://pypi.org/simple 'octodns-cloudns==0.0.19' 'octodns==1.22.0'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/installed-0.0.19/bin/python" -c 'import octodns_cloudns as c; from importlib.metadata import version; assert c.__version__ == version("octodns-cloudns") == "0.0.19"; assert "DS" not in c.ClouDNSProvider.SUPPORTS; assert hasattr(c.ClouDNSProvider, "_delete_record_ids"); print("Installed PyPI 0.0.19 verified")'
